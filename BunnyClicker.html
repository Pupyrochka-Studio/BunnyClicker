<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Кроличий кликер</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Настройки для мобильных устройств и Android TWA -->
  <meta name="theme-color" content="#fff7ec">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Кролик">

  <!-- Иконка вкладки (Favicon) -->
  <link rel="icon" type="image/png" href="/icons/icon-192.png">

  <style>
    /* Базовые стили, чтобы игра выглядела аккуратно на мобильных */
    * {
      box-sizing: border-box;
      user-select: none; /* Запрет выделения текста при кликах */
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #fff7ec;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    
    /* Сюда вы можете добавить стили вашей игры или подключить ваши существующие */
    #game-container {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <h1>🐰 Кроличий кликер</h1>
    <p id="score-text">Морковка: <span id="score">0</span></p>
    
    <!-- Кнопка кликера (пример) -->
    <button id="click-btn" style="font-size: 24px; padding: 15px 30px; cursor: pointer; border-radius: 15px; border: none; background-color: #ff9f43; color: white;">
      Собрать морковку! 🥕
    </button>
  </div>

  <!-- Ваша игровая логика -->
  <script>
    let score = 0;
    const scoreElement = document.getElementById('score');
    const clickBtn = document.getElementById('click-btn');

    clickBtn.addEventListener('click', () => {
      score++;
      scoreElement.textContent = score;
    });

    // Регистрация Service Worker для PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => {
            console.log('Service Worker успешно зарегистрирован:', reg.scope);
          })
          .catch((err) => {
            console.error('Ошибка регистрации Service Worker:', err);
          });
      });
    }
  </script>
</body>
</html>
