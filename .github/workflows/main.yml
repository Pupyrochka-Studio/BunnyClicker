name: Make icons
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw icons
        run: |
          pip install pillow
          python3 - <<'PY'
          import re, base64, io
          from PIL import Image, ImageDraw
          s = open('index.html', encoding='utf-8').read()
          b = re.search(r'var IMG=\["data:image/webp;base64,([^"]+)"', s).group(1)
          src = Image.open(io.BytesIO(base64.b64decode(b))).convert('RGBA')
          src = src.crop(src.split()[3].getbbox())
          def icon(n, scale):
              im = Image.new('RGBA', (n, n), (255, 138, 61, 255))
              ImageDraw.Draw(im).ellipse([n*.12, n*.5, n*.88, n*1.1], fill=(255, 170, 100, 255))
              k = n * scale / max(src.size)
              r = src.resize((int(src.width*k), int(src.height*k)), Image.LANCZOS)
              im.alpha_composite(r, ((n - r.width)//2, (n - r.height)//2 + int(n*.03)))
              return im.convert('RGB')
          icon(192, .78).save('icon-192.png')
          icon(512, .78).save('icon-512.png')
          icon(512, .56).save('icon-maskable-512.png')
          PY
      - name: Commit icons
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add icon-192.png icon-512.png icon-maskable-512.png
          git commit -m "Add icons" || echo nothing
          git push
